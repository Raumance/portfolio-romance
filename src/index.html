    #app-splash {

      flex-direction: column;

    #app-splash .mark {

      height: 72px;

      object-fit: cover;
    }
    #app-splash .spinner {

    }
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .spinner { animation: none; }
    }
